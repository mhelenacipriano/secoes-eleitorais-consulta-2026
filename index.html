<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23151515%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%23e5392d%27/%3E%3C/svg%3E" />
    <meta name="theme-color" content="#151515" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Aplica o tema antes da primeira pintura: escolha salva ou preferência do sistema.
      (function () {
        var t = null;
        try { t = localStorage.getItem("tema"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <meta property="og:title" content="Sua seção eleitoral mudou?" />
    <meta property="og:description" content="Consulte se a sua seção consta nas listas de locais de votação alterados para o 2º turno de 2026." />

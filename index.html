      // Aplica o tema antes da primeira pintura: escolha salva ou, sem escolha, tema claro.
      (function () {
        var t = null;
        try { t = localStorage.getItem("tema"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = "light"; // padrão: tema claro
        document.documentElement.setAttribute("data-theme", t);
      })();
